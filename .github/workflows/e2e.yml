name: E2E

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: Run e2e tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install
      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Generate env files
        run: |
          cp .env.docker.e2e.example .env.docker.e2e
          cp .env.scripts.e2e.example .env.scripts.e2e
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Restore Docker Turbo cache
        uses: actions/cache@v6
        with:
          path: .local/docker-turbo-cache
          key: docker-turbo-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docker-turbo-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Persist Docker cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        continue-on-error: true
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .local/docker-turbo-cache
      - name: Build docker compose
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker compose -f docker-compose.e2e.yml build --builder "$BUILDX_BUILDER"
          sudo systemctl restart docker
          docker compose -f docker-compose.e2e.yml up -d
          pnpm run init:e2e
          docker compose -f docker-compose.e2e.yml stop
      - name: Build dashboard repo
        env:
            CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
            BASE_BRANCH: ${{ github.base_ref }}
        run: |
          pnpm run test:e2e:build:dash
      - name: Run tests
        run: |
          pnpm run test:e2e:run
      - name: Show directus logs
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yml logs directus
